# Realistic TNT: a native trait mod (docs/native-mods.md, "Trait mods"). Explosions throw their
# blocks as flying debris, raise a column of smoke and send a shockwave ring to the shader.
# Build it with `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
[mod]
id = "realistic_tnt"
version = "0.5.1"

# Horizon main 2026-11-12 (36eb98b), NATIVE_HOOKS_API 415: the launcher 0.2.62 builds no Nightly up to 2026-11-08.
[compatibility]
horizon_revision = "36eb98b6f6ec4f22649cbe65bbfd32bc0dc2083f"

[api]
path = "api"
